<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERSHOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#9fd8ff;--ice2:#cfeeff;--deep:#040814;--dim:#8ea3bd;--f:"Outfit","Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 70% 20%,#1a3a72,#040814 60%);color:#fff;font-family:var(--f);overflow-x:hidden}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:5}
#ui{position:relative;z-index:2;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,400px);align-items:center;gap:48px;padding:40px clamp(16px,6vw,96px);max-width:1260px;margin:auto}
@media(max-width:860px){#ui{grid-template-columns:minmax(0,1fr);gap:28px;padding:36px 16px;align-content:center}h1{font-size:clamp(30px,10.4vw,64px)}}
.logo{user-select:none}
.tag{font-size:13px;letter-spacing:.38em;color:var(--ice);margin-bottom:18px;font-weight:400;opacity:.9}
h1{position:relative;font-weight:200;font-size:clamp(36px,5.6vw,86px);line-height:1;letter-spacing:.12em;margin-right:-.12em;white-space:nowrap;text-shadow:0 0 40px rgba(159,216,255,.35)}
h1{background:linear-gradient(100deg,#fff 0%,#fff 42%,#cfeeff 48%,#fff 54%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,60%{background-position:100% 0}100%{background-position:-50% 0}}
.logo>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}.logo>:nth-child(2){animation-delay:.08s}.logo>:nth-child(3){animation-delay:.16s}.logo>:nth-child(4){animation-delay:.24s}.card{animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;background:conic-gradient(from var(--a,0deg),rgba(159,216,255,0),rgba(159,216,255,.7),rgba(159,216,255,0) 30%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 8s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
h1 .cut{position:absolute;left:-2%;width:62%;top:49%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 20%,rgba(207,238,255,.9) 70%,transparent);transform:rotate(-4deg);box-shadow:0 0 12px rgba(159,216,255,.9);animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:.95}}
.sub{margin-top:24px;font-size:clamp(16px,1.7vw,19px);color:#c9d8ea;max-width:440px;line-height:1.5;font-weight:300}
.sub b{color:#fff;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chips span{font-size:12px;letter-spacing:.14em;padding:7px 12px;border-radius:999px;border:1px solid rgba(159,216,255,.25);color:#cfe3f5;background:rgba(10,20,40,.35)}
.card{position:relative;background:rgba(8,16,34,.5);border:1px solid rgba(159,216,255,.18);border-radius:18px;padding:30px 28px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.card h2{font-weight:300;font-size:26px;letter-spacing:.02em;margin-bottom:6px}
.card p{color:var(--dim);font-size:15px;margin-bottom:16px;line-height:1.45;font-weight:300}
label{display:block;font-size:12px;letter-spacing:.2em;color:var(--ice);margin:16px 0 7px;font-weight:400}
input{width:100%;padding:13px 15px;background:rgba(4,10,22,.55);border:1px solid rgba(159,216,255,.18);border-radius:10px;color:#fff;font:400 17px var(--f);outline:0;transition:.2s}
input:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(159,216,255,.15)}
.go{width:100%;margin-top:24px;padding:15px;border:0;border-radius:999px;background:linear-gradient(180deg,#d9f1ff,#9fd8ff);color:#04101f;font:600 15px var(--f);letter-spacing:.24em;cursor:pointer;transition:.2s;box-shadow:0 8px 30px rgba(159,216,255,.25)}
.go:hover,.go:focus-visible{transform:translateY(-1px);box-shadow:0 10px 40px rgba(159,216,255,.4);outline:0}
.go:disabled{opacity:.6;cursor:default;transform:none}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(4,10,22,.6);border:1px solid rgba(159,216,255,.14);margin-bottom:16px}.tabs button{flex:1;padding:10px;border:0;border-radius:999px;background:none;color:var(--dim);font:400 15px var(--f);cursor:pointer;transition:.2s}.tabs button.on{background:rgba(159,216,255,.16);color:#fff}
.link{display:block;width:100%;margin-top:14px;background:none;border:0;color:var(--dim);font:400 14px var(--f);cursor:pointer}
.link:hover{color:#fff}
#err{color:#ffb3c1;min-height:20px;margin-top:12px;font-size:14px}
#keybox{font:600 25px ui-monospace,Menlo,monospace;padding:16px;border:1px dashed rgba(159,216,255,.55);border-radius:12px;margin:6px 0 4px;letter-spacing:.1em;user-select:all;text-align:center;background:rgba(159,216,255,.06)}
.ban h2{color:#ffb3c1}
[hidden]{display:none!important}
.dots:after{content:"";animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media(prefers-reduced-motion:reduce){h1 .cut,h1,.card:before,.logo>*,.card{animation:none}}
</style></head><body>

/* ---------- sign in / create account ---------- */
let mode='signin';
const show=id=>['loading','f','ban'].forEach(n=>$(n).hidden=n!==id);
function setMode(m){mode=m;$('tin').classList.toggle('on',m==='signin');$('tnew').classList.toggle('on',m==='create');$('tin').setAttribute('aria-selected',m==='signin');$('tnew').setAttribute('aria-selected',m==='create');

$('tin').onclick=()=>setMode('signin');$('tnew').onclick=()=>setMode('create');
$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('go').disabled=true;
 try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,name:$('name').value,password:$('pw').value,invite:$('invite').value})});
  const j=await r.json();
  if(r.ok){const[x,y]=at($('go'));shatter(x,y);return}
  if(j.banned)show('ban');else{$('err').textContent=j.error;if(j.noAccount)setMode('create')}
 }catch{$('err').textContent='Could not connect. Try again.'}
 $('go').disabled=false};
fetch('/api/me').then(r=>r.json()).then(j=>{if(j.in)location.href='/play';else if(j.banned)show('ban');else{show('f');setMode('signin');if(j.kicked)$('err').textContent='You were signed out. Sign in again.'}}).catch(()=>{show('f');setMode('signin')});
