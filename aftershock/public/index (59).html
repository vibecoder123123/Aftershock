<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERSHOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#9fd8ff;--ice2:#cfeeff;--deep:#040814;--dim:#8ea3bd;--f:"Outfit","Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 70% 20%,#1a3a72,#040814 60%);color:#fff;font-family:var(--f);overflow-x:hidden}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:5}
#ui{position:relative;z-index:2;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,400px);align-items:center;gap:48px;padding:40px clamp(16px,6vw,96px);max-width:1260px;margin:auto}
@media(max-width:860px){#ui{grid-template-columns:minmax(0,1fr);gap:28px;padding:36px 16px;align-content:center}h1{font-size:clamp(30px,10.4vw,64px)}}
.logo{user-select:none}
.tag{font-size:13px;letter-spacing:.38em;color:var(--ice);margin-bottom:18px;font-weight:400;opacity:.9}
h1{position:relative;font-weight:200;font-size:clamp(36px,5.6vw,86px);line-height:1;letter-spacing:.12em;margin-right:-.12em;white-space:nowrap;text-shadow:0 0 40px rgba(159,216,255,.35)}
h1{background:linear-gradient(100deg,#fff 0%,#fff 42%,#cfeeff 48%,#fff 54%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,60%{background-position:100% 0}100%{background-position:-50% 0}}
.logo>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}.logo>:nth-child(2){animation-delay:.08s}.logo>:nth-child(3){animation-delay:.16s}.logo>:nth-child(4){animation-delay:.24s}.card{animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;background:conic-gradient(from var(--a,0deg),rgba(159,216,255,0),rgba(159,216,255,.7),rgba(159,216,255,0) 30%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 8s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
h1 .cut{position:absolute;left:-2%;width:62%;top:49%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 20%,rgba(207,238,255,.9) 70%,transparent);transform:rotate(-4deg);box-shadow:0 0 12px rgba(159,216,255,.9);animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.35}50%{opacity:.95}}
.sub{margin-top:24px;font-size:clamp(16px,1.7vw,19px);color:#c9d8ea;max-width:440px;line-height:1.5;font-weight:300}
.sub b{color:#fff;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chips span{font-size:12px;letter-spacing:.14em;padding:7px 12px;border-radius:999px;border:1px solid rgba(159,216,255,.25);color:#cfe3f5;background:rgba(10,20,40,.35)}
.card{position:relative;background:rgba(8,16,34,.5);border:1px solid rgba(159,216,255,.18);border-radius:18px;padding:30px 28px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.card h2{font-weight:300;font-size:26px;letter-spacing:.02em;margin-bottom:6px}
.card p{color:var(--dim);font-size:15px;margin-bottom:16px;line-height:1.45;font-weight:300}
label{display:block;font-size:12px;letter-spacing:.2em;color:var(--ice);margin:16px 0 7px;font-weight:400}
input{width:100%;padding:13px 15px;background:rgba(4,10,22,.55);border:1px solid rgba(159,216,255,.18);border-radius:10px;color:#fff;font:400 17px var(--f);outline:0;transition:.2s}
input:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(159,216,255,.15)}
.go{width:100%;margin-top:24px;padding:15px;border:0;border-radius:999px;background:linear-gradient(180deg,#d9f1ff,#9fd8ff);color:#04101f;font:600 15px var(--f);letter-spacing:.24em;cursor:pointer;transition:.2s;box-shadow:0 8px 30px rgba(159,216,255,.25)}
.go:hover,.go:focus-visible{transform:translateY(-1px);box-shadow:0 10px 40px rgba(159,216,255,.4);outline:0}
.go:disabled{opacity:.6;cursor:default;transform:none}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(4,10,22,.6);border:1px solid rgba(159,216,255,.14);margin-bottom:16px}.tabs button{flex:1;padding:10px;border:0;border-radius:999px;background:none;color:var(--dim);font:400 15px var(--f);cursor:pointer;transition:.2s}.tabs button.on{background:rgba(159,216,255,.16);color:#fff}
.link{display:block;width:100%;margin-top:14px;background:none;border:0;color:var(--dim);font:400 14px var(--f);cursor:pointer}
.link:hover{color:#fff}
#err{color:#ffb3c1;min-height:20px;margin-top:12px;font-size:14px}
#keybox{font:600 25px ui-monospace,Menlo,monospace;padding:16px;border:1px dashed rgba(159,216,255,.55);border-radius:12px;margin:6px 0 4px;letter-spacing:.1em;user-select:all;text-align:center;background:rgba(159,216,255,.06)}
.ban h2{color:#ffb3c1}
[hidden]{display:none!important}
.dots:after{content:"";animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media(prefers-reduced-motion:reduce){h1 .cut,h1,.card:before,.logo>*,.card{animation:none}}
</style></head><body>

 x.moveTo(C.left+r,C.top);x.arcTo(C.right,C.top,C.right,C.bottom,r);x.arcTo(C.right,C.bottom,C.left,C.bottom,r);x.arcTo(C.left,C.bottom,C.left,C.top,r);x.arcTo(C.left,C.top,C.right,C.top,r);x.fill();x.stroke();
 if('letterSpacing'in x)x.letterSpacing='0px';x.font=`300 22px ${cs.fontFamily}`;x.fillStyle='#fff';x.fillText('Entering…',C.left+28,C.top+42)}
/* ---------- glass sounds ---------- */
let noiseB=null;function nbuf(a){if(!noiseB){const n=a.sampleRate*2;noiseB=a.createBuffer(1,n,a.sampleRate);const x=noiseB.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1}return noiseB}
function burst(dur,v,type,f,q,del=0,attack=.002){const a=audioCtx();if(!a)return;const t=a.currentTime+del,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=nbuf(a);fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t,Math.random());s.stop(t+dur+.05)}
function tink(f,v,del=0){[1,2.76,5.4].forEach((m,i)=>tone(f*m,.18+.4/(i+1),v/(i*1.6+1),'sine',del+i*.002))}
function crackSnd(k){ // one sharp glass crack: a snap, a little rasp and a glassy ring
 burst(.05,.5,'highpass',3200,.7);burst(.12,.18,'bandpass',5200+R0()*2500,4,.005);burst(.18,.08,'bandpass',1800,1.5,.01);
 tone(160-k*8,.09,.25,'sine',0,70);for(let i=0;i<2+k;i++)tink(2600+R0()*3800,.035,R0()*.08)}
function freezeSnd(){burst(.45,.12,'lowpass',900,.6,0,.3);tone(420,.5,.05,'sine',0,140)}
function strainSnd(){for(let i=0;i<6;i++)tone(3000+i*530+R0()*200,.6,.012,'sine',i*.03)}

/* ---------- the crack pattern: radial cracks from the hit, rings around it ---------- */
function glassPattern(px,py,R){
 const S=15,ang=[],rings=[0];let r=16;while(r<R*1.25){rings.push(r);r=r*1.75+10}rings.push(R*1.3+60);
 for(let i=0;i<S;i++)ang.push((i+(R0()-.5)*.55)/S*6.283);
 const K=rings.length,P=[];
 for(let i=0;i<S;i++){P.push([]);let drift=0;for(let k=0;k<K;k++){drift+=(R0()-.5)*.08;const a=ang[i]+drift,rr=k?rings[k]*(.9+R0()*.2):0;P[i].push([px+Math.cos(a)*rr,py+Math.sin(a)*rr])}}
 const jit=(a,b,amt)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,o=(R0()-.5)*amt*l;return[mx-dy/l*o,my+dx/l*o]};
 const sm=[],rm=[];for(let i=0;i<S;i++){sm.push([]);rm.push([]);for(let k=0;k<K;k++){sm[i].push(k<K-1?jit(P[i][k],P[i][k+1],.16):null);rm[i].push(k?jit(P[i][k],P[(i+1)%S][k],.22):null)}}
 const polys=[],segs=[],d=p=>Math.hypot(p[0]-px,p[1]-py);
 for(let i=0;i<S;i++){const j=(i+1)%S;for(let k=0;k<K-1;k++){
  const poly=[P[i][k],sm[i][k],P[i][k+1]];if(rm[i][k+1])poly.push(rm[i][k+1]);poly.push(P[j][k+1],sm[j][k],P[j][k]);if(k&&rm[i][k])poly.push(rm[i][k]);polys.push(poly)}}
 for(let i=0;i<S;i++)for(let k=0;k<K-1;k++){segs.push([P[i][k],sm[i][k]],[sm[i][k],P[i][k+1]])}
 for(let k=1;k<K-1;k++)for(let i=0;i<S;i++){if(k>2&&R0()<.35)continue;const j=(i+1)%S;segs.push([P[i][k],rm[i][k]],[rm[i][k],P[j][k]])}
 // tiny crushed cracks right at the hit
 for(let n=0;n<26;n++){const a=R0()*6.283,r0=R0()*14,l=4+R0()*14;segs.push([[px+Math.cos(a)*r0,py+Math.sin(a)*r0],[px+Math.cos(a+(R0()-.5))*(r0+l),py+Math.sin(a+(R0()-.5))*(r0+l)]])}
 return{polys,segs:segs.map(([a,b])=>{const da=d(a),db=d(b);return da<=db?[a,b,da,db]:[b,a,db,da]})}}

function shatter(px,py){
 if(reduce){location.href='/play';return}
 const fx=$('fx'),c=fx.getContext('2d'),cid=colourId(),col=CRGB[cid]||CRGB.ice,prism=cid==='prism';
 const tint=(x,y,a)=>prism?`hsla(${(Math.atan2(y-py,x-px)*57.3+360)%360},90%,72%,${a})`:`rgba(${col.join(',')},${a})`;
 const R=Math.hypot(Math.max(px,W-px),Math.max(py,H-py)),pat=glassPattern(px,py,R),segs=pat.segs;
 const layer=document.createElement('canvas');layer.width=W*DPR;layer.height=H*DPR;const L=layer.getContext('2d');L.scale(DPR,DPR);L.lineCap='round';L.lineJoin='round';
 segs.forEach(e=>e.done=0);
 const ticks=[.06,.15,.23,.3,.36],HOLD=.66;let fired=0,front=0,target=0,shake=0,sim=0,stars=[];
 window.LOGIN&&LOGIN.freeze(true);$('ui').style.transition='filter .18s';$('ui').style.filter='grayscale(.85) brightness(.8)';
 freezeSnd();
 let prev=performance.now(),handed=false;
 (function frame(now){const dt=Math.min((now-prev)/1000,1/30);prev=now;sim+=dt;
  while(fired<ticks.length&&sim>=ticks[fired]){fired++;target=R*(.1+.95*Math.pow(fired/ticks.length,1.3));shake=7-fired;crackSnd(fired);
   for(let n=0;n<2;n++){const s=segs[Math.floor(R0()*segs.length)];if(s[2]<target)stars.push({x:s[0][0],y:s[0][1],s:26+R0()*24,l:.18,m:.18})}}
  front+=(target-front)*Math.min(dt*16,1);
  for(const e of segs){if(e[2]>=front||e.done>=1)continue;const k=Math.min((front-e[2])/Math.max(e[3]-e[2],1),1);if(k<=e.done)continue;
   const a=e[0],b=e[1],x0=a[0]+(b[0]-a[0])*e.done,y0=a[1]+(b[1]-a[1])*e.done,x1=a[0]+(b[0]-a[0])*k,y1=a[1]+(b[1]-a[1])*k,near=1-Math.min(e[2]/R,1);
   L.beginPath();L.moveTo(x0,y0);L.lineTo(x1,y1);
   L.strokeStyle=tint(x0,y0,.12);L.lineWidth=5;L.stroke(); // faint coloured glow
   L.save();L.translate(.9,.9);L.strokeStyle='rgba(0,6,18,.45)';L.lineWidth=1.6;L.stroke();L.restore(); // the dark side of the crack
   L.strokeStyle=`rgba(248,252,255,${.75+near*.25})`;L.lineWidth=.8+near*.9;L.stroke(); // the bright edge
   e.done=k}
  shake*=.82;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);c.translate((R0()-.5)*shake,(R0()-.5)*shake);
  const v=c.createRadialGradient(px,py,0,px,py,R);v.addColorStop(0,'rgba(220,240,255,.07)');v.addColorStop(1,'rgba(2,6,14,.45)');c.fillStyle=v;c.fillRect(-20,-20,W+40,H+40);
  // the crushed spot where it was hit
  const hit=c.createRadialGradient(px,py,0,px,py,26);hit.addColorStop(0,`rgba(245,252,255,${Math.min(sim*6,.85)})`);hit.addColorStop(1,'rgba(245,252,255,0)');c.fillStyle=hit;c.fillRect(px-30,py-30,60,60);
  c.drawImage(layer,0,0,W,H);
  c.globalCompositeOperation='lighter';
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.l-=dt;if(s.l<=0){stars.splice(i,1);continue}const a=s.l/s.m,n=s.s*(1.2-a*.2);
   c.fillStyle=`rgba(245,252,255,${a})`;c.fillRect(s.x-n,s.y-.8,n*2,1.6);c.fillRect(s.x-.8,s.y-n*.5,1.6,n);c.fillStyle=tint(s.x,s.y,a*.5);c.beginPath();c.arc(s.x,s.y,3,0,6.29);c.fill()}
  c.globalCompositeOperation='source-over';
  if(sim<HOLD){requestAnimationFrame(frame);return}
  if(handed)return;handed=true;strainSnd();
  try{const snap=document.createElement('canvas'),s=Math.min(1,1600/W);snap.width=Math.round(W*s);snap.height=Math.round(H*s);const x=snap.getContext('2d');x.scale(s,s);
   if(window.LOGIN)LOGIN.snap(x,W,H);else{x.fillStyle='#050a18';x.fillRect(0,0,W,H)}x.filter='grayscale(.85) brightness(.8)';paintUI(x);x.filter='none';
   x.fillStyle=v;x.fillRect(0,0,W,H);x.fillStyle=hit;x.fillRect(px-30,py-30,60,60);x.drawImage(layer,0,0,W,H);
   const r=p=>[Math.round(p[0]),Math.round(p[1])];
   sessionStorage.setItem('as-shatter',JSON.stringify({img:snap.toDataURL('image/jpeg',.84),polys:pat.polys.map(p=>p.map(r)),px,py,w:W,h:H,cid,at:Date.now()}))}catch{}
  location.href='/play'})(prev)}
const at=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};

/* ---------- sign in / create account ---------- */
let mode='signin';
const show=id=>['loading','f','ban'].forEach(n=>$(n).hidden=n!==id);
function setMode(m){mode=m;$('tin').classList.toggle('on',m==='signin');$('tnew').classList.toggle('on',m==='create');$('tin').setAttribute('aria-selected',m==='signin');$('tnew').setAttribute('aria-selected',m==='create');
 $('wi').hidden=m!=='create';$('go').textContent=m==='create'?'CREATE ACCOUNT':'SIGN IN';$('pw').autocomplete=m==='create'?'new-password':'current-password';
 $('fsub').textContent=m==='create'?'Pick a tag and a password you will remember. You need the invite code from a friend.':'Welcome back. Pick up where you left off.';$('err').textContent=''}
$('tin').onclick=()=>setMode('signin');$('tnew').onclick=()=>setMode('create');
$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('go').disabled=true;
 try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,name:$('name').value,password:$('pw').value,invite:$('invite').value})});
  const j=await r.json();
  if(r.ok){const[x,y]=at($('go'));shatter(x,y);return}
  if(j.banned)show('ban');else{$('err').textContent=j.error;if(j.noAccount)setMode('create')}
 }catch{$('err').textContent='Could not connect. Try again.'}
 $('go').disabled=false};
fetch('/api/me').then(r=>r.json()).then(j=>{if(j.in)location.href='/play';else if(j.banned)show('ban');else{show('f');setMode('signin');if(j.kicked)$('err').textContent='You were signed out. Sign in again.'}}).catch(()=>{show('f');setMode('signin')});
