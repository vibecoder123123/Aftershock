<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERSHOCK</title>
<style>
:root{--ice:#bfeaff;--dim:#8fa6bd}*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 120%,#17335f,#050a1f 62%);color:#fff;font-family:"Avenir Next",Inter,"Segoe UI",Helvetica,Arial,sans-serif}
main{width:100%;max-width:380px;text-align:center}
h1{font-size:clamp(34px,9vw,52px);font-weight:200;letter-spacing:.17em;margin-right:-.17em}
p{color:var(--ice);margin:12px 0 30px;font-size:15px;line-height:1.45}
label{display:block;text-align:left;font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px;background:rgba(5,8,16,.72);border:1px solid rgba(255,255,255,.26);color:#fff;font:inherit;font-size:16px;outline:0}
input:focus{border-color:var(--ice)}
button{width:100%;margin-top:20px;padding:14px;background:#fff;color:#000;border:0;font:inherit;font-size:13px;letter-spacing:.3em;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.link{background:none;color:var(--dim);letter-spacing:.04em;font-size:14px;font-weight:500;margin-top:12px}
#err{color:#ff8fa3;min-height:20px;margin-top:14px;font-size:14px}
#keybox{font:600 24px ui-monospace,Menlo,monospace;padding:16px;border:1px solid var(--ice);margin:12px 0;letter-spacing:.08em;user-select:all}
[hidden]{display:none!important}
</style></head><body><main>
<h1>AFTERSHOCK</h1>
<div id="loading"><p>Loading…</p></div>
<form id="f" hidden><p>Pick a username to play.</p>
<label for="name">USERNAME</label><input id="name" maxlength="16" autocomplete="off" spellcheck="false" required>
<div id="wi"><label for="invite">INVITE CODE</label><input id="invite" autocomplete="off"></div>
<div id="wk" hidden><label for="key">LOGIN KEY</label><input id="key" autocomplete="off"></div>
<div id="wp" hidden><label for="pw">OWNER PASSWORD</label><input id="pw" type="password" autocomplete="current-password"></div>
<button id="go">ENTER</button>
<button id="swap" type="button" class="link">Already have an account?</button>
<div id="err" role="alert"></div></form>
<div id="saved" hidden><p>Save this key. You need it to log in on another device or browser.</p><div id="keybox"></div><button id="cont">PLAY</button></div>
<div id="ban" hidden><p>You've been banned from AFTERSHOCK.</p></div>
</main><script>
const $=i=>document.getElementById(i);let hasKey=false;
const show=id=>['loading','f','saved','ban'].forEach(n=>$(n).hidden=n!==id);
function sync(){const o=$('name').value.trim().toLowerCase()==='honk';$('wp').hidden=!o;$('wk').hidden=o||!hasKey;$('wi').hidden=o||hasKey;$('swap').hidden=o;$('swap').textContent=hasKey?'New here? Use an invite code':'Already have an account?'}
$('name').oninput=sync;$('swap').onclick=()=>{hasKey=!hasKey;$('err').textContent='';sync()};
$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('go').disabled=true;
 try{const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,invite:$('invite').value,key:hasKey?$('key').value:'',password:$('pw').value})});
  const j=await r.json();
  if(r.ok){if(j.key){$('keybox').textContent=j.key;show('saved')}else location.href='/play'}
  else if(j.banned)show('ban');else{$('err').textContent=j.error;if(j.taken&&!hasKey){hasKey=true;sync()}}
 }catch{$('err').textContent='Could not connect. Try again.'}
 $('go').disabled=false};
$('cont').onclick=()=>location.href='/play';
fetch('/api/me').then(r=>r.json()).then(j=>{if(j.in)location.href='/play';else if(j.banned)show('ban');else{show('f');sync()}}).catch(()=>{show('f');sync()});
</script></body></html>
