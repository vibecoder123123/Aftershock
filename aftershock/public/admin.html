<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Players</title>
<style>
:root{--ice:#bfeaff;--dim:#8fa6bd}*{box-sizing:border-box;margin:0}
body{min-height:100vh;padding:32px 16px;background:#060a14;color:#fff;font-family:"Avenir Next",Inter,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:auto}h1{font-size:30px;font-weight:300;letter-spacing:.12em;margin-bottom:22px}
input{padding:11px;background:#0c1220;border:1px solid rgba(255,255,255,.24);color:#fff;font:inherit;font-size:16px;min-width:0;flex:1}
button{padding:11px 16px;background:#fff;color:#000;border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.row{display:flex;gap:8px;margin-bottom:12px}.lab{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:600;margin:22px 0 7px}
#err{color:#ff8fa3;min-height:20px;margin:8px 0}
.p{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.p b{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}.p small{color:var(--dim)}
.p.off b{color:#ff8fa3;text-decoration:line-through}
small.on{color:#5dffa8;font-weight:700}.nk{border:1px solid var(--ice);padding:12px;margin:10px 0;display:grid;gap:8px}.nk code{font:600 22px ui-monospace,Menlo,monospace;user-select:all}.p .mute,.p .ban{padding:9px 10px;font-size:12px}
.who{flex:1;min-width:0;display:grid;gap:2px}.who b{flex:none}.st{color:var(--dim);font-size:12px}.hint{color:var(--dim);font-size:13px;margin:-4px 0 6px}.p{flex-wrap:wrap}
.an{display:flex;gap:8px;align-items:center;padding:9px 0 9px 12px;border-left:2px solid var(--ice);margin-bottom:6px;background:#0c1220}.an span{flex:1;min-width:0;overflow-wrap:anywhere}.an button{padding:8px 12px;font-size:12px}button:disabled{opacity:.5;cursor:default}
.ban{background:#ff5470;color:#000}.mute{background:#1a2233;color:#fff}
[hidden]{display:none!important}
</style></head><body><main><h1>PLAYERS</h1>
<form id="login" class="row"><input id="pw" type="password" placeholder="Owner password" aria-label="Owner password" autocomplete="current-password"><button>OPEN</button></form>
<div id="err" role="alert"></div>
<div id="app" hidden>
<div id="nk" hidden class="nk"><span>New password for <b id="nkn"></b>. Send it to them:</span><code id="nkv"></code><button type="button" class="mute" onclick="this.parentNode.hidden=true">DONE</button></div>
<div class="lab">ANNOUNCEMENTS</div><form id="annf" class="row"><input id="ann" maxlength="200" placeholder="Message for every player" aria-label="New announcement"><button id="annsend">SEND</button></form><div id="anns"></div>
<div class="lab">BACKUP</div><div class="row"><button id="bk" type="button" class="mute" style="flex:1">DOWNLOAD BACKUP</button></div>
<div class="lab">INVITE CODE</div><form id="inv" class="row"><input id="code" aria-label="Invite code" autocomplete="off"><button>CHANGE</button></form>
<div class="lab"><span id="n"></span> PLAYERS</div><input id="q" placeholder="Search" aria-label="Search players" style="width:100%;margin-bottom:6px"><div id="list"></div>
</div></main><script>
const $=i=>document.getElementById(i);let pw='',all=[],now=Date.now(),anns=[],first=true,busy=0;
function fmt(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`}
function status(ms){if(!ms)return'';const a=now-ms;if(a<150000)return'ONLINE';if(a>3600000)return'';const m=Math.max(1,Math.round(a/60000));return'Online '+m+' min ago'}
async function call(b){$('err').textContent='';busy++;let r;try{r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,...b})})}catch{busy--;$('err').textContent='Could not connect.';return false}const j=await r.json();busy--;
 if(!r.ok){$('err').textContent=j.error;return false}all=j.players;now=j.now;anns=j.announce||[];drawAnns();if(j.newKey){$('nk').hidden=false;$('nkn').textContent=j.keyFor;$('nkv').textContent=j.newKey}if(first){$('code').value=j.invite;first=false}$('app').hidden=false;$('login').hidden=true;draw();return true}
function drawAnns(){const el=$('anns');el.textContent='';if(!anns.length){const p=document.createElement('p');p.className='hint';p.textContent='No announcements showing.';el.append(p);return}
 anns.forEach(a=>{const d=document.createElement('div');d.className='an';const t=document.createElement('span');t.textContent=a.text;const x=document.createElement('button');x.className='mute';x.textContent='REMOVE';x.onclick=async()=>{x.disabled=true;x.textContent='…';await call({action:'unannounce',id:a.id})};d.append(t,x);el.append(d)})}
function draw(){const q=$('q').value.toLowerCase();$('n').textContent=all.length;const el=$('list');el.textContent='';
 all.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{const d=document.createElement('div');d.className='p'+(p.banned?' off':'');const b=document.createElement('b');b.textContent=p.name;d.append(b);
  const t=status(p.seen);if(t){const o=document.createElement('small');o.textContent=t;o.className=t==='ONLINE'?'on':'';d.append(o)}
  if(p.owner){const s=document.createElement('small');s.textContent='OWNER';d.append(s)}
  const box=document.createElement('div');box.className='who';box.append(b);const st=p.stats;const line=document.createElement('small');line.className='st';
  line.textContent=st?`Ch ${st.ch} · ${Math.round(st.score).toLocaleString()} pts · ${fmt(st.time)} played`:'No games yet';box.append(line);d.prepend(box);
  if(!p.owner){const x=document.createElement('button');x.className=p.banned?'mute':'ban';x.textContent=p.banned?'UNBAN':'BAN';x.onclick=()=>call({action:p.banned?'unban':'ban',name:p.name});d.append(x);
  const kk=document.createElement('button');kk.className='mute';kk.textContent='KICK';kk.title='Signs them out. They can sign back in with their password.';kk.onclick=()=>call({action:'kick',name:p.name});d.append(kk);
  const k=document.createElement('button');k.className='mute';k.textContent='RESET PASSWORD';k.title='Gives this player a new password and signs them out';k.onclick=()=>{if(confirm('Reset the password for '+p.name+'? They get signed out everywhere.'))call({action:'reset',name:p.name})};d.append(k);
  const r=document.createElement('button');r.className='mute';r.textContent='FREE NAME';r.title='Deletes the account so the name can be used again';r.onclick=()=>{if(confirm('Delete '+p.name+'?'))call({action:'remove',name:p.name})};d.append(r)}
  el.append(d)})}
$('login').onsubmit=e=>{e.preventDefault();pw=$('pw').value;call({})};
$('inv').onsubmit=e=>{e.preventDefault();call({action:'invite',code:$('code').value})};$('q').oninput=draw;
$('annf').onsubmit=async e=>{e.preventDefault();const t=$('ann').value.trim();if(!t||$('annsend').disabled)return;$('annsend').disabled=true;$('annsend').textContent='…';const ok=await call({action:'announce',text:t});$('annsend').disabled=false;$('annsend').textContent='SEND';if(ok&&$('ann').value.trim()===t)$('ann').value=''};
$('bk').onclick=async()=>{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,action:'backup'})});const j=await r.json();if(!r.ok){$('err').textContent=j.error;return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j.backup,null,1)],{type:'application/json'}));a.download='aftershock-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};setInterval(()=>{if(pw&&!busy&&!document.hidden&&!$('app').hidden)call({})},15000);
</script></body></html>
